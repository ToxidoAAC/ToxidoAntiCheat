# Skidfuscator 2.0.11 Community
# ProGuard runs first and renames our classes; this pass adds string/number
# encryption and control-flow obfuscation. Renamers stay off because the free
# edition does not include them and ProGuard already handled names.

exempt: [
  "class{^com\\/google\\/}",
  "class{^org\\/fusesource\\/}",
  "class{^dev\\/toxido\\/anticheat\\/app\\/MinecraftProcess$}",
  "class{^dev\\/toxido\\/anticheat\\/app\\/ApiClient\\$StartResult$}",
  "class{^dev\\/toxido\\/anticheat\\/agent\\/asm\\/}",
  "class{^dev\\/toxido\\/anticheat\\/agent\\/HookBridge$}",
  "class{^dev\\/toxido\\/anticheat\\/agent\\/AttackEvent$}"
]

libs: []

stringEncryption {
  type: STANDARD
  enabled: true
  exempt: []
}

numberEncryption {
  enabled: true
  exempt: []
}

flowCondition {
  enabled: true
  exempt: []
}

flowException {
  enabled: true
  strength: WEAK
  exempt: [
    "class{^dev\\/toxido\\/anticheat\\/app\\/m$}"
  ]
}

flowRange {
  enabled: true
  exempt: []
}

flowFactoryMaker {
  enabled: true
  exempt: []
}

flowSwitch {
  enabled: true
  exempt: []
}

outliner {
  enabled: false
  exempt: []
}

ahegao {
  enabled: false
  exempt: []
}

native: {
  enabled: false
  exempt: []
}

driver: {
  enabled: false
}

reference {
  enabled: false
}

fileCrasher: {
  enabled: false
}

classRenamer {
  enabled: false
}

methodRenamer {
  enabled: false
}

fieldRenamer {
  enabled: false
}
